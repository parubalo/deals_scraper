name: Daily Deal Scraper

on:
  schedule:
    - cron: '0 23 * * *' # 6:00 PM EST is 23:00 (11:00 PM) UTC
  workflow_dispatch:      # Allows you to run it manually from the "Actions" tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests pandas pytz

      - name: Run Scraper
        env:
          DEALSLIDE_EMAIL: ${{ secrets.DEALSLIDE_EMAIL }}
          DEALSLIDE_PWD: ${{ secrets.DEALSLIDE_PWD }}
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add deals_history.csv
          git commit -m "Auto-update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
